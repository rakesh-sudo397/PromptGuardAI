<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptGuard AI - Analytics</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }
        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(16px);
        }
        .stat-title {
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }
        .stat-value {
            font-size: 2.2rem;
            font-weight: bold;
            font-family: 'Outfit', sans-serif;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.5rem;
        }
        th, td {
            text-align: left;
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            color: var(--text-secondary);
            font-weight: bold;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        td {
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <a href="/sandbox" class="tab-btn">Sandbox Console</a>
            <a href="/dashboard" class="tab-btn active">Analytics Dashboard</a>
        </div>
        
        <h1>PromptGuard Security Analytics</h1>
        <p style="color: var(--text-secondary); margin-top: -0.5rem; margin-bottom: 3rem;">Real-time threat statistics, database size, and latency parameters.</p>

        <div class="metrics-grid">
            <div class="stat-card">
                <div class="stat-title">Total Scans</div>
                <div class="stat-value" id="valTotal">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Blocked Attacks</div>
                <div class="stat-value" id="valBlocked" style="color: #f43f5e;">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Mean Risk Score</div>
                <div class="stat-value" id="valAvgRisk">0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Average Latency</div>
                <div class="stat-value" id="valAvgLatency">0 ms</div>
            </div>
        </div>

        <div class="card">
            <h2 style="margin-top: 0;">Threat Distribution by Category</h2>
            <table>
                <thead>
                    <tr>
                        <th>Category</th>
                        <th>Occurrences</th>
                    </tr>
                </thead>
                <tbody id="tblDistributionBody">
                    <tr>
                        <td colspan="2" style="text-align: center; color: var(--text-secondary);">Waiting for data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchSystemStats() {
            try {
                const res = await fetch('/api/v1/metrics');
                const data = await res.json();
                
                document.getElementById('valTotal').innerText = data.total_scans;
                document.getElementById('valBlocked').innerText = data.blocked_scans;
                document.getElementById('valAvgRisk').innerText = (data.average_risk * 100).toFixed(2) + '%';
                document.getElementById('valAvgLatency').innerText = data.average_latency + ' ms';
                
                const tableBody = document.getElementById('tblDistributionBody');
                tableBody.innerHTML = '';
                
                const categories = Object.keys(data.threat_distribution);
                if (categories.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="2" style="text-align: center; color: var(--text-secondary);">No scan telemetry logged.</td></tr>`;
                    return;
                }

                categories.forEach(cat => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>${cat}</strong></td>
                        <td>${data.threat_distribution[cat]}</td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (err) {
                console.error("Dashboard error: ", err);
            }
        }
        
        fetchSystemStats();
        setInterval(fetchSystemStats, 10000); // 10s auto-refresh
    </script>
</body>
</html>
