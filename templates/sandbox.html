<!--
Filename: templates/sandbox.html
Action: CREATE
Purpose: Interactive sandbox page for security developers to audit prompt outputs.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptGuard AI - Sandbox Console</title>
    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: #151d30;
            --txt: #f1f5f9;
            --accent: #2563eb;
            --green: #10b981;
            --red: #f43f5e;
            --border: #1e293b;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--txt);
            margin: 0;
            padding: 2.5rem;
            display: flex;
            justify-content: center;
        }
        .wrapper {
            width: 100%;
            max-width: 800px;
        }
        .navigation {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .navigation a {
            color: #64748b;
            text-decoration: none;
            padding: 0.5rem 1.2rem;
            border-radius: 0.5rem;
            background-color: var(--card-bg);
            transition: all 0.2s;
        }
        .navigation a.active, .navigation a:hover {
            color: var(--txt);
            background-color: var(--accent);
        }
        .console-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }
        textarea {
            width: 100%;
            height: 140px;
            background-color: #0b0f19;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: var(--txt);
            padding: 1rem;
            box-sizing: border-box;
            font-size: 1rem;
            margin-bottom: 1.25rem;
            resize: vertical;
        }
        textarea:focus {
            outline: 2px solid var(--accent);
        }
        .btn-scan {
            background-color: var(--accent);
            color: var(--txt);
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .btn-scan:hover {
            opacity: 0.95;
        }
        .output-container {
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 0.5rem;
            background-color: #0b0f19;
            border: 1px solid var(--border);
            display: none;
        }
        .badge {
            padding: 0.3rem 0.8rem;
            border-radius: 9999px;
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
        .bg-red { background-color: var(--red); }
        .bg-green { background-color: var(--green); }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .stat-box {
            background-color: var(--card-bg);
            padding: 1rem;
            border-radius: 0.375rem;
            border: 1px solid var(--border);
        }
        .stat-label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .stat-val {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="navigation">
            <a href="/sandbox" class="active">Sandbox Console</a>
            <a href="/dashboard">Analytics Dashboard</a>
        </div>
        <h1>PromptGuard Security Sandbox</h1>
        <p style="color: #64748b; margin-top: -0.5rem; margin-bottom: 2rem;">Test prompts in real-time to analyze how rules and classifiers handle threats.</p>

        <div class="console-card">
            <textarea id="txtPrompt" placeholder="Write standard text or inject malicious jailbreak patterns to test..."></textarea>
            <button class="btn-scan" onclick="executeSecurityCheck()">Execute Guard Scan</button>

            <div id="pnlOutput" class="output-container">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3>Analysis Verdict</h3>
                    <span id="lblDecision" class="badge"></span>
                </div>
                
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-label">Identified Threat Class</div>
                        <div class="stat-val" id="valCategory">-</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Calculated Risk Score</div>
                        <div class="stat-val" id="valRisk">-</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Scan Latency</div>
                        <div class="stat-val" id="valLatency">-</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function executeSecurityCheck() {
            const promptText = document.getElementById('txtPrompt').value.trim();
            if (!promptText) return alert("Prompt string cannot be empty.");

            const scanBtn = document.querySelector('.btn-scan');
            scanBtn.innerText = 'Evaluating...';
            scanBtn.disabled = true;

            try {
                const res = await fetch('/api/v1/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptText })
                });
                
                const payload = await res.json();
                
                document.getElementById('pnlOutput').style.display = 'block';
                const decisionBadge = document.getElementById('lblDecision');
                
                if (payload.decision === "BLOCK" || !payload.is_safe) {
                    decisionBadge.innerText = 'BLOCKED / THREAT';
                    decisionBadge.className = 'badge bg-red';
                } else {
                    decisionBadge.innerText = 'PASSED / SAFE';
                    decisionBadge.className = 'badge bg-green';
                }

                document.getElementById('valCategory').innerText = payload.category;
                document.getElementById('valRisk').innerText = (payload.risk_score * 100).toFixed(2) + '%';
                document.getElementById('valLatency').innerText = payload.latency_ms + ' ms';

            } catch (error) {
                alert("API communication error: " + error);
            } finally {
                scanBtn.innerText = 'Execute Guard Scan';
                scanBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
